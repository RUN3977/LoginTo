name: login_to
description: "Local-first multi-device account and secret data manager with proximity sync."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  
  # Encryption
  cryptography: ^3.4.0
  pointycastle: ^3.7.0
  
  # Networking & Sync
  mdns_sd: ^1.0.0
  http: ^1.1.0
  
  # OCR
  google_ml_kit: ^0.13.0
  
  # Notifications
  flutter_local_notifications: ^16.2.0
  
  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  
  # UI & Utils
  provider: ^6.0.0
  get_it: ^7.6.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  image_picker: ^1.0.0
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.0
  barcode_scan2: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  test: ^1.24.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
